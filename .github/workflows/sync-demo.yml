# Keep the demo in step with the live app.
#
# Every change that lands on the live branch is merged into the demo branch
# (claude/demo-environment), which the demo deployment builds from, and pushed.
# Near-free on GitHub Actions: no install, no build and no test suite here.
# Vercel builds the demo (and keeps the previous deployment if that build
# fails), and the suite runs locally before every merge (see RELEASING.md).
# If the merge conflicts — usually where the demo deliberately differs from
# live (sign-in, demo data, storage isolation) — nothing is pushed and an
# issue says what needs resolving by hand.
name: Keep the demo in step

on:
  push:
    branches: [claude/build-tracker-xq65z0]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

# One sync at a time, never cancelled half-way: each run merges whatever live
# is at by then, so a queued run simply finds the demo current.
concurrency:
  group: sync-demo
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      LIVE: claude/build-tracker-xq65z0
      DEMO: claude/demo-environment
    steps:
      # The whole commit graph (so the merge finds the right base) but file
      # contents only as the merge needs them: quick on any history length.
      - uses: actions/checkout@v4
        with:
          ref: claude/demo-environment
          fetch-depth: 0
          filter: blob:none

      - name: Merge live into the demo
        id: merge
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # The demo keeps its own copy of any file marked merge=ours in its
          # .gitattributes, whatever live does to it.
          git config merge.ours.driver true
          git fetch --no-tags origin "$LIVE"
          if git merge-base --is-ancestor "origin/$LIVE" HEAD; then
            echo "result=current" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if git merge --no-edit "origin/$LIVE" -m "Keep the demo in step: merge $LIVE"; then
            echo "result=merged" >> "$GITHUB_OUTPUT"
          else
            echo "files=$(git diff --name-only --diff-filter=U | tr '\n' ' ')" >> "$GITHUB_OUTPUT"
            git merge --abort
            echo "result=conflict" >> "$GITHUB_OUTPUT"
          fi

      # The one check kept here: a demo-only guard that needs no install (plain
      # node, a few seconds), because it lives only on the demo branch and so is
      # not covered by the local run before a merge to live. Skipped where the
      # demo has no such guard.
      - name: Demo guard (no install)
        id: guard
        if: steps.merge.outputs.result == 'merged' && hashFiles('tests/demo-clean.test.mjs') != ''
        env:
          DEMO_MODE: "1"
        run: node --test tests/demo-clean.test.mjs

      - name: Push the demo
        id: push
        if: steps.merge.outputs.result == 'merged' && steps.guard.outcome != 'failure'
        # The demo can move while this runs (another merge landing at the same
        # time). Then fold the newer demo in and push again, rather than fail.
        run: |
          for attempt in 1 2 3; do
            git push origin "HEAD:$DEMO" && exit 0
            sleep $((attempt * 5))
            git fetch --no-tags origin "$DEMO"
            git merge --no-edit "origin/$DEMO" -m "Keep the demo in step: fold in the newer demo" || { git merge --abort; exit 1; }
          done
          exit 1

      - name: Say what needs resolving
        if: always() && (steps.merge.outputs.result == 'conflict' || steps.guard.outcome == 'failure' || steps.push.outcome == 'failure')
        uses: actions/github-script@v7
        env:
          RESULT: ${{ steps.merge.outputs.result }}
          FILES: ${{ steps.merge.outputs.files }}
          GUARD: ${{ steps.guard.outcome }}
        with:
          script: |
            const title = "Demo is behind live — needs a hand merge";
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const why = process.env.RESULT === "conflict"
              ? `Merging \`${process.env.LIVE}\` into \`${process.env.DEMO}\` conflicts in: ${process.env.FILES || "(see the run)"}. These are usually places where the demo deliberately differs from live (sign-in, demo data, storage isolation) — resolve keeping the demo's behaviour, then merge.`
              : process.env.GUARD === "failure"
                ? `\`${process.env.LIVE}\` merged into \`${process.env.DEMO}\` cleanly, but the demo guard (tests/demo-clean.test.mjs) failed, so nothing was pushed.`
                : `\`${process.env.LIVE}\` merged into \`${process.env.DEMO}\` cleanly, but the push to the demo branch failed (see the run), so nothing was pushed.`;
            const body = `${why}\n\nRun: ${run}\nCommit: ${context.sha}`;
            const open = await github.rest.issues.listForRepo({ ...context.repo, state: "open", per_page: 100 });
            const existing = open.data.find((i) => i.title === title && !i.pull_request);
            if (existing) await github.rest.issues.createComment({ ...context.repo, issue_number: existing.number, body });
            else await github.rest.issues.create({ ...context.repo, title, body });
            core.setFailed(why);

      - name: Close the notice once the demo is current
        if: steps.merge.outputs.result == 'current' || steps.push.outcome == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            const title = "Demo is behind live — needs a hand merge";
            const open = await github.rest.issues.listForRepo({ ...context.repo, state: "open", per_page: 100 });
            for (const i of open.data.filter((x) => x.title === title && !x.pull_request)) {
              await github.rest.issues.createComment({ ...context.repo, issue_number: i.number, body: "The demo is in step with live again." });
              await github.rest.issues.update({ ...context.repo, issue_number: i.number, state: "closed", state_reason: "completed" });
            }
